<body>
  <style>
    /* Estilos preventivos de FOUC */
    html, body {
      background-color: #5A252C;
      margin: 0;
      padding: 0;
    }
    
    /* Preloader Styles */
    .cmc-preloader {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #5A252C;
      color: #FFFDFC;
      font-family: 'Montserrat', 'Roboto', sans-serif;
      padding: 24px;
      box-sizing: border-box;
      text-align: center;
    }
    
    .cmc-preloader-logo {
      width: clamp(210px, 40vw, 330px);
      max-width: 100%;
      height: auto;
      object-fit: contain;
      margin-bottom: 30px;
    }
    
    .cmc-preloader-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 8px 0;
      letter-spacing: 0.5px;
    }
    
    .cmc-preloader-subtitle {
      font-size: 0.95rem;
      color: #F8E9EC;
      margin: 0 0 30px 0;
      font-weight: 400;
    }
    
    .cmc-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(248, 233, 236, 0.15);
      border-top-color: #E2B84F;
      border-radius: 50%;
      animation: cmc-spin 0.9s linear infinite;
    }
    
    @keyframes cmc-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .cmc-spinner {
        animation: none;
        border-color: #E2B84F;
        opacity: 0.7;
      }
    }
  </style>

  <app-root>
    <div class="cmc-preloader" role="status" aria-live="polite" aria-busy="true">
      <img src="https://res.cloudinary.com/dy3ibnjl7/image/upload/f_auto,q_auto,w_200/v1782840424/Dise%C3%B1o_sin_t%C3%ADtulo_4_xruh6t.png" alt="Logo de Casa de Música Castillo" width="200" height="75" class="cmc-preloader-logo">
      <h2 class="cmc-preloader-title">Preparando la tienda</h2>
      <p class="cmc-preloader-subtitle">Estamos afinando la experiencia para ti.</p>
      <div class="cmc-spinner" aria-hidden="true"></div>
    </div>
  </app-root>
